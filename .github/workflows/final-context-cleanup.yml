name: Final context cleanup

on:
  push:
    paths:
      - '.github/workflows/final-context-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean authorship and project history
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('codimension_three_automorphisms.tex')
          s=p.read_text(encoding='utf-8')
          s=s.replace('\\author{Open AI}', '\\author{Zhijie He}')
          s=s.replace('pdfauthor={Open AI}', 'pdfauthor={Zhijie He}')
          p.write_text(s, encoding='utf-8')
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('The manuscript is credited to **Open AI**. The proof was produced with Astra during an investigation of the Lesieutre-Litt question.',
                      'AI-assisted tools were used during exploration, checking, and manuscript preparation.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: codimension_three_automorphisms.tex
          texlive_version: 2026
      - name: Audit rebuilt PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils ripgrep
          mkdir -p output/pdf
          cp codimension_three_automorphisms.pdf output/pdf/Automorphisms_of_blowups_codimension_at_least_three.pdf
          pdfinfo output/pdf/Automorphisms_of_blowups_codimension_at_least_three.pdf | grep -F 'Author:          Zhijie He'
          pdftotext output/pdf/Automorphisms_of_blowups_codimension_at_least_three.pdf /tmp/paper.txt
          if rg -n -i 'OpenAI|Open AI|ChatGPT|GPT[- ]?[0-9]|Claude|Astra|Aristotle|undergraduate|thesis|defense|public version|private version|our conversation|chat history|prompt' /tmp/paper.txt README.md codimension_three_automorphisms.tex; then
            echo 'Forbidden context remains' >&2
            exit 1
          fi
      - name: Commit cleanup
        run: |
          rm -f .github/workflows/conversation-trace-audit.yml .github/workflows/final-context-cleanup.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use human authorship and remove research-process attribution'
          git push
