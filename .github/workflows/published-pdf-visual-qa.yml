name: Retain published PDF for independent visual QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/published-pdf-visual-qa.yml'
      - 'output/pdf/Automorphisms_of_blowups_codimension_at_least_three.pdf'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-current-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published files
        uses: actions/checkout@v4
      - name: Verify PDF files are present
        shell: bash
        run: |
          set -euo pipefail
          test -s 'output/pdf/Automorphisms_of_blowups_codimension_at_least_three.pdf'
          sha256sum 'output/pdf/Automorphisms_of_blowups_codimension_at_least_three.pdf'
      - name: Retain exact published PDF bytes
        uses: actions/upload-artifact@v4
        with:
          name: blowup-pdf-${{ github.sha }}
          path: |
            output/pdf/Automorphisms_of_blowups_codimension_at_least_three.pdf
          if-no-files-found: error
          retention-days: 14
