name: Build manuscript PDF

on:
  push:
    paths:
      - 'codimension_three_automorphisms.tex'
      - 'codimension_three_automorphisms.bbl'
      - 'references.bib'
      - 'Makefile'
      - '.github/workflows/reconstruct-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: codimension_three_automorphisms.tex
          latexmk_use_xelatex: false

      - name: Install generated PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/pdf
          cp codimension_three_automorphisms.pdf output/pdf/Automorphisms_of_blowups_codimension_at_least_three.pdf
          sha256sum output/pdf/Automorphisms_of_blowups_codimension_at_least_three.pdf > SHA256SUMS.txt

      - name: Commit PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/pdf/Automorphisms_of_blowups_codimension_at_least_three.pdf SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'No PDF changes to commit.'
            exit 0
          fi
          git commit -m 'Build manuscript PDF'
          git push
