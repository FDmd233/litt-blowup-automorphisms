name: Render authorship QA

on:
  push:
    paths:
      - '.github/workflows/render-authorship-qa.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render first page
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p /tmp/render
          pdfinfo output/pdf/Automorphisms_of_blowups_codimension_at_least_three.pdf | grep -F 'Author:          Zhijie He'
          pdftoppm -f 1 -singlefile -png -r 150 output/pdf/Automorphisms_of_blowups_codimension_at_least_three.pdf /tmp/render/page >/dev/null 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: blowup-authorship-qa
          path: /tmp/render/page.png
