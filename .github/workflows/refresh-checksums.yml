name: Refresh current checksums

on:
  push:
    paths:
      - '.github/workflows/refresh-checksums.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recompute current PDF checksum
        run: |
          sha256sum output/pdf/Automorphisms_of_blowups_codimension_at_least_three.pdf > SHA256SUMS.txt
      - name: Commit checksum update and remove temporary workflow
        run: |
          rm -f .github/workflows/refresh-checksums.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh current PDF checksum'
          git push
